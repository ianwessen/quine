    <pre id="source"><code class="language-html"></code></pre>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script>
      fetch(location.href)
        .then((r) => r.text())
        .then((text) => {
          const code = document.querySelector("#source code");
          code.textContent = text;
          Prism.highlightElement(code);

          code.querySelectorAll(".token.comment").forEach((el) => {
            el.innerHTML = el.innerHTML
              .replace(/(?<!["\w])([\w.]+\.com\/[\w\-\/]+)/g, '<a href="https://$1">$1</a>')
              .replace(/(?<!["\w])([\w.]+\.io\/[\w\-\/]+)/g,  '<a href="https://$1">$1</a>')
              .replace(/\b([\w.]+@[\w.]+\.com)\b/g, '<a href="mailto:$1">$1</a>');
          });
        });
    </script>
    <style>
      :root { --bone: #faf9f6; --ink: #383a42; --muted: #7c828a; }
      * { margin: 0; box-sizing: border-box; }
      body {
        background: var(--bone);
        color: var(--ink);
        display: flex;
        justify-content: center;
        padding: 1rem;
        min-height: 100vh;
      }
      pre[class*="language-"],
      code[class*="language-"] {
        font-family: monospace;
        font-size: 13px;
        background: none;
      }
      .token.comment,
      .token.prolog {
        color: var(--muted);
        font-style: normal;
      }
      .token.comment a { color: var(--muted); text-decoration: underline; }
      .token.comment a:hover { color: var(--ink); }
      body > :not(#source) { display: none; }
